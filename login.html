<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — HopWire for Brewery Owners</title>
    <link rel="stylesheet" href="assets/styles.css?v=3">
</head>
<body>
    <nav class="site-nav">
        <div class="wrap nav-row">
            <a class="brand" href="index.html">
                <span class="name"><span class="mark"></span> HopWire</span>
                <span class="tagline nav-text">for Brewery Owners</span>
            </a>
            <div class="nav-links">
                <a class="text-link nav-text" href="signup.html">Need an account? Sign up</a>
            </div>
        </div>
    </nav>

    <div class="auth-shell">
        <div class="card auth-card">
            <h1>Log in</h1>
            <p class="sub">Manage your events, specials, and beer releases.</p>

            <div class="alert" id="alert"></div>

            <form id="login-form">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-pill primary" id="submit-btn">Log In</button>
            </form>

            <p class="auth-foot">New brewery? <a href="signup.html">Create an account</a></p>
        </div>
    </div>

    <script src="assets/app.js?v=3"></script>
    <script>
        const form = document.getElementById("login-form");
        const alertEl = document.getElementById("alert");
        const submitBtn = document.getElementById("submit-btn");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            HW.hideAlert(alertEl);
            submitBtn.disabled = true;
            submitBtn.textContent = "Logging in…";

            try {
                const res = await fetch(`${HW.API_BASE}/api/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: document.getElementById("email").value.trim(),
                        password: document.getElementById("password").value
                    })
                });

                const body = await res.json().catch(() => null);

                if (!res.ok) {
                    throw new Error((body && body.message) || "Invalid email or password.");
                }

                if (!body.role || !body.role.startsWith("business_")) {
                    throw new Error("This login is for brewery owners. Download the HopWire app to browse as a customer.");
                }

                HW.setSession({
                    token: body.token,
                    breweryId: body.id,
                    breweryName: body.fullName,
                    email: body.email,
                    role: body.role
                });

                window.location.href = "dashboard.html";
            } catch (err) {
                HW.showAlert(alertEl, err.message);
                submitBtn.disabled = false;
                submitBtn.textContent = "Log In";
            }
        });
    </script>
</body>
</html>
