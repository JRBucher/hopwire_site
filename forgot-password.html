<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — HopWire for Brewery Owners</title>
    <link rel="stylesheet" href="assets/styles.css?v=9">
</head>
<body>
    <nav class="site-nav">
        <div class="wrap nav-row">
            <a class="brand" href="index.html">
                <span class="name"><span class="mark"></span> HopWire</span>
                <span class="tagline nav-text">for Brewery Owners</span>
            </a>
            <div class="nav-links">
                <a class="text-link nav-text" href="login.html">Back to log in</a>
            </div>
        </div>
    </nav>

    <div class="auth-shell">
        <div class="card auth-card">
            <h1>Reset your password</h1>
            <p class="sub" id="step1-sub">Enter your account email and we'll send you a reset code.</p>

            <div class="alert" id="alert"></div>

            <!-- STEP 1: REQUEST CODE -->
            <form id="request-form">
                <div class="field">
                    <label for="request-email">Email</label>
                    <input type="email" id="request-email" autocomplete="email" required>
                </div>
                <button type="submit" class="btn-pill primary" id="request-submit-btn">Send Reset Code</button>
            </form>

            <!-- STEP 2: ENTER CODE + NEW PASSWORD -->
            <form id="reset-form" style="display:none;">
                <p class="sub">Enter the 6-digit code we emailed you, and your new password.</p>
                <div class="field">
                    <label for="reset-code">Reset code</label>
                    <input type="text" id="reset-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
                </div>
                <div class="field">
                    <label for="new-password">New password</label>
                    <input type="password" id="new-password" autocomplete="new-password" minlength="8" required>
                </div>
                <button type="submit" class="btn-pill primary" id="reset-submit-btn">Reset Password</button>
            </form>

            <p class="auth-foot">Remembered it? <a href="login.html">Log in</a></p>
        </div>
    </div>

    <script src="assets/app.js?v=4"></script>
    <script>
        const alertEl = document.getElementById("alert");
        const requestForm = document.getElementById("request-form");
        const resetForm = document.getElementById("reset-form");
        const step1Sub = document.getElementById("step1-sub");
        let resetEmail = "";

        requestForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            HW.hideAlert(alertEl);
            const btn = document.getElementById("request-submit-btn");
            btn.disabled = true;
            btn.textContent = "Sending…";

            resetEmail = document.getElementById("request-email").value.trim();

            try {
                const res = await fetch(`${HW.API_BASE}/api/password/request-reset`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: resetEmail })
                });
                const body = await res.json().catch(() => null);
                if (!res.ok) throw new Error((body && body.message) || "Something went wrong. Please try again.");

                requestForm.style.display = "none";
                step1Sub.textContent = `If ${resetEmail} is registered, a reset code is on its way.`;
                resetForm.style.display = "block";
            } catch (err) {
                HW.showAlert(alertEl, err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "Send Reset Code";
            }
        });

        resetForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            HW.hideAlert(alertEl);
            const btn = document.getElementById("reset-submit-btn");
            btn.disabled = true;
            btn.textContent = "Resetting…";

            try {
                const res = await fetch(`${HW.API_BASE}/api/password/reset`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: resetEmail,
                        code: document.getElementById("reset-code").value.trim(),
                        newPassword: document.getElementById("new-password").value
                    })
                });
                const body = await res.json().catch(() => null);
                if (!res.ok) throw new Error((body && body.message) || "Something went wrong. Please try again.");

                resetForm.style.display = "none";
                step1Sub.textContent = "Password updated — you can log in now.";
                HW.showAlert(alertEl, "Your password has been reset.", "success");
                setTimeout(() => { window.location.href = "login.html"; }, 1500);
            } catch (err) {
                HW.showAlert(alertEl, err.message);
                btn.disabled = false;
                btn.textContent = "Reset Password";
            }
        });
    </script>
</body>
</html>
